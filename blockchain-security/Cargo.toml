[package]
name = "muse-blockchain-security"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = "0.7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
solana-client = "1.18.0"
solana-sdk = "1.18.0"
aes-gcm = "0.10.3"
rand = "0.8.5"
reqwest = { version = "0.11", features = ["json"] }
